name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'ai-engine/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'ai-engine/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: List installed packages
        run: |
          python -m pip list
      - name: AI Engine Diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}/ai-engine:${{ github.workspace }}/backend
        run: |
          python - <<'PY'
          import sys
          import traceback

          print("PYTHON VERSION:")
          print(sys.version)

          print("\nPYTHONPATH:")
          print(sys.path)

          print("\nTESTING AI ENGINE IMPORTS:")

          modules = [
              "movement.engine.movement_engine",
              "intelligence.engine.intelligence_engine",
              "prediction.engine.prediction_engine",
          ]

          for module in modules:
              try:
                  __import__(module)
                  print(f"SUCCESS: {module}")
              except Exception as e:
                  print(f"FAILED: {module}")
                  print(f"EXCEPTION TYPE: {type(e).__name__}")
                  print(f"EXCEPTION: {e}")
                  traceback.print_exc()

          print("\nTESTING BACKEND ADAPTER:")

          try:
              sys.path.insert(0, "backend")
              from app.services.ai_engine_adapter import venue_registry

              print("AI_ENGINE_AVAILABLE:",
                    venue_registry.is_ai_engine_available)

              print("IMPORT_ERROR:",
                    venue_registry.import_error)

              if not venue_registry.is_ai_engine_available:
                  raise RuntimeError(
                      "REAL AI ENGINE FAILED TO LOAD IN CI. "
                      "See the full traceback above."
                  )

          except Exception:
              traceback.print_exc()
              raise
          PY
      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ai-engine:${{ github.workspace }}/backend
        run: |
          cd backend
          python -m pytest tests/ -v
